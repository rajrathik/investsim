<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Allocation Simulator</title>
<meta name="description" content="Backtest a dollar-cost averaging portfolio with real historical prices, dividends, and money market rates over 1-20 years.">
<link rel="canonical" href="https://investsim.claritycapitaltools.com/portfolio-simulator.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Asset Allocation Simulator">
<meta property="og:description" content="Backtest a dollar-cost averaging portfolio with real historical prices, dividends, and money market rates over 1-20 years.">
<meta property="og:url" content="https://investsim.claritycapitaltools.com/portfolio-simulator.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Asset Allocation Simulator">
<meta name="twitter:description" content="Backtest a dollar-cost averaging portfolio with real historical prices, dividends, and money market rates over 1-20 years.">

<meta property="og:site_name" content="Investment Tools">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared-analytics.css?v=1">
<link rel="stylesheet" href="portfolio-simulator.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Asset Allocation Simulator",
  "url": "https://investsim.claritycapitaltools.com/portfolio-simulator.html",
  "description": "Backtest a dollar-cost averaging portfolio with real historical prices, dividends, and money market rates over 1-20 years.",
  "applicationCategory": "FinanceApplication",
  "operatingSystem": "Web Browser",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
<script src="theme-toggle.js?v=2"></script>
<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
</head>
<body>

<div class="header" id="mainHeader">
  <a href="/" class="back-home">← Home</a>
  <h1 class="space"><span style="color:var(--accent)">◆</span> Asset Allocation Simulator</h1>
  <div class="header-sub"><a href="/simulator-guide.html">? How It Works</a></div>
</div>
<div class="container" id="mainContainer">
  <div class="grid-2">
    <div class="card fade-up">
      <h2 class="space">💰 Investment Parameters</h2>
      <div style="margin-bottom:24px"><div class="label">Monthly Investment</div><div class="btn-row" id="amtBtns"></div><input type="number" id="amt" class="inp" value="1000" min="1" placeholder="Or enter custom amount..."></div>
      <div style="margin-bottom:24px"><div class="label">Annual Deposit Growth</div><input type="number" id="growthInp" class="inp" value="0" min="0" step="50" placeholder="$ increase per year (0 = flat)"><div style="font-size:11px;color:var(--text3);margin-top:4px;font-family:'JetBrains Mono',monospace">Year 1: base amount, Year 2: +growth, Year 3: +2&times;growth...</div></div>
      <div><div class="label">Investment Period (Years)</div><div class="btn-row" id="yrBtns"></div><input type="number" id="yrInp" class="inp" value="10" min="1" max="20" placeholder="Or enter years..."></div>
    </div>
    <div class="card fade-up" style="animation-delay:.1s">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 class="space" style="margin:0">📊 Select &amp; Allocate</h2>
        <div style="display:flex;gap:8px"><button class="btn-sm" style="background:var(--blue-dim);color:var(--blue)" onclick="eqSplit()">Equal Split</button><button class="btn-sm" style="background:var(--red-dim);color:var(--red)" onclick="resetA()">Reset All</button></div>
      </div>
      <div class="search-wrap"><input type="text" id="searchInp" class="search-inp" placeholder="🔍 Click to browse tickers or type to search..." autocomplete="off"><div id="dropdown" class="dropdown"></div></div>
      <div id="chips" class="chips"></div>
      <div id="budgetBar" class="budget"></div>
      <div id="allocList" class="alloc-list"></div>
    </div>
  </div>
  <button id="runBtn" class="run" onclick="simulate()" disabled>▶ Run Simulation</button>
  <div id="err" class="err"></div>
  <div id="results"></div>
</div>
<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal"><h3 class="space"><span id="modalTitle">Portfolio Breakdown</span><button class="close-btn" onclick="closeModal()">✕</button></h3><div id="modalSub" class="modal-sub"></div><div id="modalBody"></div></div>
</div>
<script src="portfolio-simulator.js?v=13"></script>
<script src="shared-auth.js"></script>
<script>try{navigator.sendBeacon('/api/track/pageview',JSON.stringify({page:location.pathname,referrer:document.referrer}))}catch(e){}</script>
</body>
</html>
