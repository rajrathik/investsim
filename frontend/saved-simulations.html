<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="description" content="View, compare, and manage your saved portfolio simulation results. Save up to 3 backtested portfolios.">
<link rel="canonical" href="https://investsim.claritycapitaltools.com/saved-simulations.html">

<meta property="og:title" content="Saved Simulations">
<meta property="og:description" content="View, compare, and manage your saved portfolio simulation results. Save up to 3 backtested portfolios.">
<meta property="og:url" content="https://investsim.claritycapitaltools.com/saved-simulations.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Saved Simulations">
<meta name="twitter:description" content="View, compare, and manage your saved portfolio simulation results. Save up to 3 backtested portfolios.">

<meta property="og:site_name" content="Investment Tools">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Saved Simulations",
  "description": "View, compare, and manage your saved portfolio simulation results. Save up to 3 backtested portfolios.",
  "url": "https://investsim.claritycapitaltools.com/saved-simulations.html",
  "applicationCategory": "FinanceApplication",
  "isPartOf": {"@type": "WebSite", "name": "Investment Tools", "url": "https://investsim.claritycapitaltools.com/"}
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared-analytics.css?v=9">
<script src="theme-toggle.js?v=2"></script>
<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<style>
.container{max-width:900px;margin:0 auto;padding:32px 24px}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:8px}
.page-sub{font-size:14px;color:var(--text2);margin-bottom:32px}

/* Auth gate */
.auth-gate{text-align:center;padding:60px 24px}
.auth-gate p{color:var(--text3);font-size:15px;margin-bottom:20px}
.auth-gate-btn{display:inline-block;padding:12px 32px;border:none;border-radius:12px;font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;background:var(--accent);color:var(--bg);text-decoration:none;transition:opacity .15s}
.auth-gate-btn:hover{opacity:.85}

/* Simulation cards */
.sim-grid{display:flex;flex-direction:column;gap:16px}
.sim-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:border-color .2s}
.sim-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sim-num{font-size:18px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--text1)}
.sim-delete{padding:6px 14px;border:1px solid rgba(239,68,68,.25);border-radius:8px;background:var(--red-dim);color:var(--red);font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .2s}
.sim-delete:hover{border-color:var(--red);background:rgba(239,68,68,.25)}
.sim-tickers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sim-ticker-tag{padding:5px 10px;background:var(--accent-dim);border:1px solid rgba(16,185,129,.2);border-radius:8px;font-size:12px;font-weight:600;color:var(--accent);font-family:'JetBrains Mono',monospace}
.sim-meta{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-bottom:14px}
.sim-values{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
@media(max-width:600px){.sim-values{grid-template-columns:1fr 1fr}}
.sim-val-item{padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px}
.sim-val-label{font-size:13px;color:var(--text3);font-family:'DM Sans',sans-serif;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.sim-val-num{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace}

/* Tile info icon */
.stile-info{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text3);width:14px;height:14px;border:1px solid var(--border);border-radius:50%;transition:all .2s;position:relative;font-family:'JetBrains Mono',monospace;line-height:1;flex-shrink:0}
.stile-info:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.stile-tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:200px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:400;color:var(--text2);text-transform:none;letter-spacing:0;line-height:1.5;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:left;white-space:normal}
.stile-tip::after{content:'';position:absolute;bottom:-5px;left:50%;width:8px;height:8px;background:var(--card);border-right:1px solid var(--border);border-bottom:1px solid var(--border);transform:translateX(-50%) rotate(45deg)}
.stile-info:hover .stile-tip{display:block}
html[data-theme="light"] .stile-tip{box-shadow:0 8px 24px rgba(0,0,0,.1)}
.sim-return{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;background:var(--card);border:1px solid var(--border);border-radius:16px}
.empty-state .em-icon{font-size:48px;margin-bottom:12px}
.empty-state p{color:var(--text3);font-size:14px;line-height:1.7}
.empty-state a{color:var(--accent);text-decoration:none;font-weight:600}
.empty-state a:hover{text-decoration:underline}

.loading{text-align:center;padding:60px;color:var(--text3)}
</style>
</head>
<body>

<div id="siteNavRoot"></div>

<div class="header">
  <h1 class="space">Saved Simulations</h1>
</div>

<div class="container">
  <!-- Auth gate — shown when not signed in -->
  <div id="authGate" class="auth-gate" style="display:none">
    <div style="font-size:48px;margin-bottom:16px">🔒</div>
    <p>Sign in to view your saved portfolio simulations</p>
    <button class="auth-gate-btn" onclick="window._pubSignOut?location.href='/':void(0)">Sign In from Home</button>
  </div>

  <!-- Main content — shown when signed in -->
  <div id="mainContent" style="display:none">
    <div class="page-title">Your Saved Portfolios</div>
    <div class="page-sub">You can save up to 3 portfolio simulations. Run a simulation and click "Save" to add one here.</div>
    <div id="simList" class="sim-grid">
      <div class="loading">Loading your simulations...</div>
    </div>
  </div>
</div>

<script src="site-nav.js?v=7"></script>
<script src="shared-auth.js"></script>
<script>
function fmt(n){return (n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}

var TILE_INFO={
  totalinvested:'Total dollar amount deposited over the simulation period. Includes base monthly amount plus any annual growth increases.',
  equity:'Current market value of all shares held, calculated as total shares × latest closing price for each ticker.',
  dividends:'Total cash dividends received from all holdings over the entire period. Dividends are not reinvested — they accrue in a cash account.',
  cashaccrual:'Accumulated dividends plus money-market interest earned on that cash. This is your total cash pile from dividends + interest.',
  mmearned:'Money-market interest earned on your accumulated dividend cash. The difference between Cash Accrual and Dividends Earned.',
  portfolio:'Combined value of equity holdings + cash accrual. This is your total portfolio worth: shares value + all accumulated cash.'
};
function ti(key){return '<span class="stile-info" onclick="event.stopPropagation()">?<span class="stile-tip">'+TILE_INFO[key]+'</span></span>';}

function renderSims(sims){
  var el=document.getElementById('simList');
  if(!sims.length){
    el.innerHTML='<div class="empty-state"><p>No saved simulations yet.<br>Go to the <a href="/portfolio-simulator.html">Portfolio Simulator</a>, run a simulation, and click <strong>Save</strong>.</p></div>';
    return;
  }
  var h='';
  sims.forEach(function(s,i){
    var tickers=JSON.parse(s.tickers_json);
    var retColor=s.total_return_pct>=0?'var(--accent)':'var(--red)';
    var retSign=s.total_return_pct>=0?'+':'';

    h+='<div class="sim-card">';
    h+='<div class="sim-header"><span class="sim-num">Portfolio #'+(i+1)+'</span>';
    h+='<button class="sim-delete" onclick="deleteSim('+s.id+')">🗑️ Delete</button></div>';

    /* Ticker tags */
    h+='<div class="sim-tickers">';
    Object.keys(tickers).forEach(function(sym){
      h+='<span class="sim-ticker-tag">'+sym+' '+tickers[sym]+'%</span>';
    });
    h+='</div>';

    /* Meta */
    h+='<div class="sim-meta">'+s.start_year+'–'+s.end_year+' &nbsp;|&nbsp; $'+fmt(s.monthly_amount)+'/mo';
    if(s.annual_growth>0) h+=' +$'+fmt(s.annual_growth)+'/yr';
    h+='</div>';

    /* Values grid */
    h+='<div class="sim-values">';
    h+='<div class="sim-val-item"><div class="sim-val-label">Total Invested'+ti('totalinvested')+'</div><div class="sim-val-num" style="color:var(--text1)">$'+fmt(s.total_invested)+'</div></div>';
    h+='<div class="sim-val-item"><div class="sim-val-label">Equity Value'+ti('equity')+'</div><div class="sim-val-num" style="color:var(--accent)">$'+fmt(s.equity_value)+'</div></div>';
    h+='<div class="sim-val-item"><div class="sim-val-label">Dividends Earned'+ti('dividends')+'</div><div class="sim-val-num" style="color:var(--gold)">$'+fmt(s.dividends_earned)+'</div></div>';
    h+='<div class="sim-val-item"><div class="sim-val-label">Cash Accrual'+ti('cashaccrual')+'</div><div class="sim-val-num" style="color:var(--gold)">$'+fmt(s.cash_accrual)+'</div></div>';
    h+='<div class="sim-val-item"><div class="sim-val-label">MM Earned'+ti('mmearned')+'</div><div class="sim-val-num" style="color:var(--text2)">$'+fmt(s.mm_earned)+'</div></div>';
    h+='<div class="sim-val-item"><div class="sim-val-label">Portfolio Balance'+ti('portfolio')+'</div><div class="sim-val-num" style="color:var(--blue)">$'+fmt(s.portfolio_balance)+'</div></div>';
    h+='</div>';

    /* Return + MMF */
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';
    h+='<span class="sim-return" style="color:'+retColor+'">Return: '+retSign+s.total_return_pct.toFixed(1)+'%</span>';
    h+='<span style="font-size:12px;color:var(--text3);font-family:JetBrains Mono,monospace">MMF: $'+fmt(s.mmf_value)+'</span>';
    h+='</div>';

    h+='</div>';
  });
  el.innerHTML=h;
}

async function loadSims(){
  if(!window._pubAuthFetch){
    document.getElementById('simList').innerHTML='<div class="loading">Waiting for auth...</div>';
    return;
  }
  try{
    var resp=await window._pubAuthFetch('/api/simulations');
    if(!resp.ok){
      document.getElementById('simList').innerHTML='<div style="color:var(--red);text-align:center;padding:40px">Failed to load simulations</div>';
      return;
    }
    var sims=await resp.json();
    renderSims(sims);
  }catch(e){
    document.getElementById('simList').innerHTML='<div style="color:var(--red);text-align:center;padding:40px">Error: '+e.message+'</div>';
  }
}

async function deleteSim(simId){
  if(!confirm('Delete this saved simulation?'))return;
  try{
    var resp=await window._pubAuthFetch('/api/simulations/'+simId,{method:'DELETE'});
    if(resp.ok){
      loadSims();
    }else{
      var d=await resp.json().catch(function(){return{}});
      alert('Delete failed: '+(d.detail||'Unknown error'));
    }
  }catch(e){
    alert('Delete failed: '+e.message);
  }
}

/* Wait for shared-auth to finish, then decide what to show */
function checkAuth(){
  if(window._pubIsSignedIn&&window._pubIsSignedIn()){
    document.getElementById('authGate').style.display='none';
    document.getElementById('mainContent').style.display='';
    loadSims();
  }else{
    document.getElementById('authGate').style.display='';
    document.getElementById('mainContent').style.display='none';
  }
}

/* Listen for auth events */
window.addEventListener('pubauth',function(){checkAuth()});
/* Also check on load (cached user) */
setTimeout(checkAuth,500);
</script>
<script>try{navigator.sendBeacon('/api/track/pageview',JSON.stringify({page:location.pathname,referrer:document.referrer}))}catch(e){}</script>
</body>
</html>
